<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>docker-ext-dns</title>
<style>
  /* Design language: HashiCorp dark marketing/product system, Vault identity.
     Near-black canvas, charcoal surface lift, 1px translucent hairlines, one
     type family across the hierarchy (500 body / 600 emphasis / 700 display)
     with tight display + relaxed body line-heights. Vault yellow is the single
     product-identity accent; hyperlink blue is the only other chromatic voice.

     Dark is the brand mode and the default. The light mode below is a mirror of
     the same token system, not a second palette: canvas becomes inverse-canvas,
     ink becomes inverse-ink, and the muted/subtle text steps reuse the
     documented #3b3d45 / #656a76 grays rather than introducing new mid-tones.
     Vault yellow stays the sole identity accent for filled surfaces; thin
     chromatic marks (sort arrow, tab underline) switch to amber-200 #bb5a00
     because yellow hairlines vanish on white. */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root, :root[data-theme="dark"] {
    color-scheme: dark;

    --canvas: #000000;
    --surface-1: #15181e;
    --surface-2: #1f232b;
    --surface-3: #3b3d45;
    --hairline: rgba(178,182,189,0.12);
    --hairline-soft: rgba(178,182,189,0.06);

    --ink: #ffffff;
    --ink-muted: #b2b6bd;
    --ink-subtle: #656a76;
    --text-muted: #656a76;            /* alias consumed by inline row styles */

    --accent-blue: #2b89ff;           /* hyperlinks */
    --vault: #ffcf25;                 /* product identity accent */
    --vault-ink: #000000;             /* readable text on Vault yellow */
    --mark: #ffcf25;                  /* thin accent marks: arrows, underlines */

    --success: #00ca8e;
    --warning: #ffcf25;
    --error: #e62b1e;

    --row-hover: rgba(255,255,255,0.02);

    --badge-ok-bg: rgba(0,202,142,0.14);    --badge-ok-fg: #34e2ad;
    --badge-nx-bg: rgba(230,43,30,0.16);    --badge-nx-fg: #ff6b62;
    --badge-mm-bg: rgba(187,90,0,0.24);     --badge-mm-fg: #ffab5e;
    --badge-sv-bg: rgba(255,207,37,0.14);   --badge-sv-fg: #ffcf25;
    --badge-idle-bg: rgba(178,182,189,0.10);--badge-idle-fg: #b2b6bd;

    --type-a-bg: rgba(43,137,255,0.14);     --type-a-fg: #7db4ff;
    --type-cname-bg: rgba(167,55,255,0.16); --type-cname-fg: #c6a3ff;

    --chip-bg: #3b3d45;                     --chip-fg: #b2b6bd;
    --chip-traefik-bg: rgba(20,198,203,0.14); --chip-traefik-fg: #4fd6da;

    --r-sm: 6px;
    --r-md: 8px;
    --r-lg: 12px;
    --r-pill: 9999px;

    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --mono: 'SF Mono', 'Fira Code', ui-monospace, Menlo, monospace;
  }

  :root[data-theme="light"] {
    color-scheme: light;

    --canvas: #ffffff;
    --surface-1: #f4f5f6;
    --surface-2: #e9ebed;
    --surface-3: #dcdee1;
    --hairline: rgba(59,61,69,0.16);
    --hairline-soft: rgba(59,61,69,0.08);

    --ink: #000000;
    --ink-muted: #3b3d45;
    --ink-subtle: #656a76;
    --text-muted: #656a76;

    --accent-blue: #1361c9;           /* accent-blue darkened for white ground */
    --vault: #ffcf25;
    --vault-ink: #000000;
    --mark: #bb5a00;                  /* amber-200 — yellow marks fade on white */

    --success: #00794f;
    --warning: #bb5a00;
    --error: #c11f14;

    --row-hover: rgba(0,0,0,0.03);

    --badge-ok-bg: rgba(0,202,142,0.18);    --badge-ok-fg: #00764d;
    --badge-nx-bg: rgba(230,43,30,0.12);    --badge-nx-fg: #b81b11;
    --badge-mm-bg: rgba(187,90,0,0.14);     --badge-mm-fg: #bb5a00;
    --badge-sv-bg: rgba(255,207,37,0.34);   --badge-sv-fg: #6b5200;
    --badge-idle-bg: rgba(59,61,69,0.10);   --badge-idle-fg: #656a76;

    --type-a-bg: rgba(43,137,255,0.12);     --type-a-fg: #1258b8;
    --type-cname-bg: rgba(167,55,255,0.12); --type-cname-fg: #7719c9;

    --chip-bg: rgba(59,61,69,0.10);         --chip-fg: #3b3d45;
    --chip-traefik-bg: rgba(20,198,203,0.18); --chip-traefik-fg: #0b6f72;
  }

  body {
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--font);
    font-size: 14px;
    font-weight: 500;
    line-height: 1.5;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* top-nav ---------------------------------------------------------------- */
  header {
    background: var(--canvas);
    border-bottom: 1px solid var(--hairline);
    height: 64px;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.4px;
  }
  .logo-dot {
    width: 12px;
    height: 12px;
    border-radius: var(--r-sm);
    background: var(--vault);
    flex-shrink: 0;
  }

  .header-actions { margin-left: auto; display: flex; gap: 12px; align-items: center; }
  .header-actions .divider {
    width: 1px;
    height: 20px;
    background: var(--hairline);
  }

  /* buttons: charcoal secondary CTA by default; the active group toggle lifts
     into the Vault product accent as an identity signal. */
  button {
    font-family: var(--font);
    background: var(--surface-2);
    border: 1px solid var(--hairline);
    color: var(--ink);
    padding: 8px 16px;
    border-radius: var(--r-md);
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.29;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  button:hover { background: var(--surface-3); }
  /* square-ish icon-only variant (theme toggle) — same 8px corner, no label */
  button.icon-btn {
    padding: 8px 11px;
    font-size: 15px;
    line-height: 1;
    min-width: 36px;
  }
  button.active {
    background: var(--vault);
    border-color: var(--vault);
    color: var(--vault-ink);
  }
  button.active:hover { background: var(--vault); filter: brightness(1.06); }

  /* tabs ------------------------------------------------------------------- */
  .tabs {
    background: var(--canvas);
    border-bottom: 1px solid var(--hairline);
    padding: 0 32px;
    display: flex;
    gap: 4px;
    overflow-x: auto;
  }
  .tab {
    padding: 12px 14px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    color: var(--ink-subtle);
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 14px;
    font-weight: 600;
    transition: color 0.15s, border-color 0.15s;
    user-select: none;
  }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--ink); border-bottom-color: var(--mark); }
  .tab .led {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--surface-3); display: inline-block; flex-shrink: 0;
  }
  .tab .led.ok  { background: var(--success); }
  .tab .led.err { background: var(--error); }
  .tab .led.outdated { background: var(--warning); }

  /* content ---------------------------------------------------------------- */
  main { padding: 32px; }

  .eyebrow {
    display: block;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.23;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: var(--ink-subtle);
    margin-bottom: 16px;
  }

  /* surface-1 charcoal card holding the toolbar + records table */
  .panel {
    background: var(--surface-1);
    border: 1px solid var(--hairline);
    border-radius: var(--r-lg);
    overflow: hidden;
  }

  .toolbar {
    display: flex;
    gap: 12px;
    padding: 16px;
    border-bottom: 1px solid var(--hairline);
    flex-wrap: wrap;
    align-items: center;
  }

  .toolbar select {
    font-family: var(--font);
    background: var(--surface-2);
    border: 1px solid var(--hairline);
    color: var(--ink);
    padding: 8px 12px;
    border-radius: var(--r-md);
    font-size: 14px;
    font-weight: 500;
  }
  .toolbar select:focus { outline: none; border-color: var(--accent-blue); }

  .count { color: var(--ink-subtle); font-size: 13px; margin-left: auto; letter-spacing: 0.2px; }

  .table-wrap { overflow-x: auto; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }

  /* column headers double as eyebrow-style category labels */
  th {
    text-align: left;
    padding: 12px 16px;
    color: var(--ink-subtle);
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    border-bottom: 1px solid var(--hairline);
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
    background: var(--surface-1);
  }
  th:hover { color: var(--ink-muted); }
  th .arrow { opacity: 0; margin-left: 4px; font-size: 9px; color: var(--mark); }
  th.sorted .arrow { opacity: 1; }
  th.sorted { color: var(--ink); }

  td {
    padding: 12px 16px;
    border-bottom: 1px solid var(--hairline-soft);
    vertical-align: middle;
    color: var(--ink);
    white-space: nowrap;
  }

  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: var(--row-hover); }

  /* Grouped view collapses a hostname's records into one row; when a column
     holds several distinct values they are joined by this muted separator. */
  .cell-sep { color: var(--ink-subtle); opacity: 0.6; margin: 0 2px; }

  /* DNS status badges — semantic color on a matching translucent tint. */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 9px;
    border-radius: var(--r-pill);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.3px;
    white-space: nowrap;
  }
  .badge::before {
    content: '';
    width: 6px; height: 6px; border-radius: 50%;
    background: currentColor;
  }
  .badge.NOERROR  { background: var(--badge-ok-bg);   color: var(--badge-ok-fg); }
  .badge.NXDOMAIN { background: var(--badge-nx-bg);   color: var(--badge-nx-fg); }
  .badge.MISMATCH { background: var(--badge-mm-bg);   color: var(--badge-mm-fg); }
  .badge.SERVFAIL { background: var(--badge-sv-bg);   color: var(--badge-sv-fg); }
  .badge.checking { background: var(--badge-sv-bg);   color: var(--badge-sv-fg); }
  .badge.pending  { background: var(--badge-idle-bg); color: var(--badge-idle-fg); }

  .type-badge {
    background: var(--type-a-bg);
    color: var(--type-a-fg);
    padding: 2px 8px;
    border-radius: var(--r-sm);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    font-family: var(--mono);
  }
  .type-badge.CNAME { background: var(--type-cname-bg); color: var(--type-cname-fg); }

  .source-badge {
    padding: 2px 8px;
    border-radius: var(--r-sm);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    background: var(--chip-bg);
    color: var(--chip-fg);
  }
  .source-badge.traefik { background: var(--chip-traefik-bg); color: var(--chip-traefik-fg); }

  .mono { font-family: var(--mono); font-size: 12px; }

  .instance-label {
    background: var(--chip-bg);
    color: var(--chip-fg);
    padding: 2px 8px;
    border-radius: var(--r-sm);
    font-size: 11px;
    font-weight: 500;
  }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-subtle);
  }
  .empty p { margin-top: 8px; font-size: 13px; }
  .hidden { display: none !important; }

  .refresh-time { color: var(--ink-subtle); font-size: 13px; }
  a.refresh-time { text-decoration: none; color: var(--accent-blue); transition: color 0.15s; }
  a.refresh-time:hover { text-decoration: underline; }
  .refresh-time.outdated { color: var(--error); }
  a.refresh-time.outdated { color: var(--error); }
  a.refresh-time.outdated:hover { text-decoration: underline; }

  @media (max-width: 640px) {
    header, .tabs { padding-left: 16px; padding-right: 16px; }
    main { padding: 20px 16px; }
  }
</style>
<script>
  // Apply the stored theme before first paint so a light-mode reload never
  // flashes the dark canvas. Key must match THEME_KEY below.
  try {
    const t = localStorage.getItem('ext-dns-theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch {}
</script>
</head>
<body>

<header>
  <h1><span class="logo-dot"></span>docker-ext-dns</h1>
  <div class="header-actions">
    <span class="refresh-time" id="lastRefresh"></span>
    <span class="divider"></span>
    <a class="refresh-time" id="appVersion" href="https://github.com/ZeroOmar/docker-ext-dns" target="_blank" rel="noopener"></a>
    <button onclick="refresh()">↻ Refresh</button>
    <button class="icon-btn" id="themeToggle" onclick="toggleTheme()"></button>
  </div>
</header>

<div class="tabs" id="tabs"></div>

<main>
  <span class="eyebrow">DNS Records</span>
  <div class="panel">
    <div class="toolbar">
      <select id="filterPlugin" onchange="applyFilters()">
        <option value="">All plugins</option>
      </select>
      <select id="filterStatus" onchange="applyFilters()">
        <option value="">All statuses</option>
        <option value="NOERROR">NOERROR</option>
        <option value="NXDOMAIN">NXDOMAIN</option>
        <option value="MISMATCH">MISMATCH</option>
        <option value="SERVFAIL">SERVFAIL</option>
        <option value="checking">Checking</option>
        <option value="pending">Pending</option>
      </select>
      <button id="groupToggle" onclick="toggleGroup()">⊞ Group by hostname</button>
      <span class="count" id="recordCount"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr id="headRow">
            <th data-key="_instance">Instance<span class="arrow"></span></th>
            <th data-key="container_name">Container<span class="arrow"></span></th>
            <th data-key="plugin">Plugin<span class="arrow"></span></th>
            <th data-key="hostname">Hostname<span class="arrow"></span></th>
            <th data-key="record_type">Type<span class="arrow"></span></th>
            <th data-key="value">Value<span class="arrow"></span></th>
            <th data-key="source">Source<span class="arrow"></span></th>
            <th data-key="last_updated">Last Updated<span class="arrow"></span></th>
            <th data-key="dns_status">DNS Status<span class="arrow"></span></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty hidden" id="emptyState">
        <div style="font-size:32px">🔍</div>
        <p id="emptyMsg">No records found.</p>
      </div>
    </div>
  </div>
</main>

<script>
const FETCH_TIMEOUT = 8000;

let allRecords = [];
let instanceStatuses = {};
let activeTab = 'all';
let instances = [];   // populated on each refresh from server
let sortKey = null;   // null = default order (instance, then container)
let sortDir = 1;      // 1 = ascending, -1 = descending
let grouped = true;   // collapse records sharing a hostname into one row

const LOCAL = { name: 'local', proxied: false };
const GITHUB_TAGS_URL = 'https://api.github.com/repos/ZeroOmar/docker-ext-dns/tags';
const VERSION_CHECK_INTERVAL = 6 * 60 * 60 * 1000;  // 6 hours

let currentVersion = null;          // running version of the local instance
let latestVersion = null;           // newest semver tag on GitHub, parsed
let instanceVersions = {};          // { instanceName: "x.y.z" }

function fetchWithTimeout(url, timeout) {
  const controller = new AbortController();
  const id = setTimeout(() => controller.abort(), timeout);
  return fetch(url, { signal: controller.signal }).finally(() => clearTimeout(id));
}

async function loadVersion() {
  try {
    const r = await fetchWithTimeout('/api/health', 3000);
    if (r.ok) {
      const { version } = await r.json();
      if (version) {
        currentVersion = version;
        document.getElementById('appVersion').textContent = 'v' + version;
        checkLatestVersion();
      }
    }
  } catch {}
}

// Parse "1.2.3" (or "v1.2.3") into [1, 2, 3]; returns null on garbage.
function parseSemver(v) {
  const m = String(v).trim().replace(/^v/i, '').match(/^(\d+)\.(\d+)\.(\d+)/);
  return m ? [+m[1], +m[2], +m[3]] : null;
}

// Returns 1 if a > b, -1 if a < b, 0 if equal.
function cmpSemver(a, b) {
  for (let i = 0; i < 3; i++) {
    if (a[i] !== b[i]) return a[i] > b[i] ? 1 : -1;
  }
  return 0;
}

// True if `version` (a "x.y.z" string) is older than the latest GitHub tag.
function isOutdated(version) {
  if (!latestVersion || !version) return false;
  const v = parseSemver(version);
  return v ? cmpSemver(latestVersion, v) > 0 : false;
}

async function checkLatestVersion() {
  try {
    const r = await fetchWithTimeout(GITHUB_TAGS_URL, 5000);
    if (!r.ok) return;
    const tags = await r.json();
    let latest = null;
    for (const t of tags) {
      const v = parseSemver(t.name);
      if (v && (!latest || cmpSemver(v, latest) > 0)) latest = v;
    }
    if (!latest) return;
    latestVersion = latest;
    updateVersionIndicator();
    renderTabs();  // re-color LEDs now that we know the latest version
  } catch {}
}

// Color the local version label red when an update is available.
function updateVersionIndicator() {
  const el = document.getElementById('appVersion');
  if (!currentVersion || !latestVersion) return;
  if (isOutdated(currentVersion)) {
    el.classList.add('outdated');
    el.title = `Update available: v${latestVersion.join('.')} (you have v${currentVersion})`;
  } else {
    el.classList.remove('outdated');
    el.title = 'Up to date';
  }
}

async function loadInstances() {
  try {
    const [instR, healthR] = await Promise.allSettled([
      fetchWithTimeout('/api/instances', 3000),
      fetchWithTimeout('/api/health', 3000),
    ]);
    if (healthR.status === 'fulfilled' && healthR.value.ok) {
      const h = await healthR.value.json();
      if (h.name) LOCAL.name = h.name;   // configurable local instance name
    }
    if (instR.status === 'fulfilled' && instR.value.ok) {
      const remote = await instR.value.json();
      instances = [LOCAL, ...remote];
      return;
    }
  } catch {}
  instances = [LOCAL];
}

function fetchRecords(inst) {
  if (!inst.proxied) {
    return fetchWithTimeout('/api/records', FETCH_TIMEOUT)
      .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); });
  }
  return fetchWithTimeout(`/api/instances/${encodeURIComponent(inst.name)}/records`, FETCH_TIMEOUT)
    .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); });
}

// Best-effort: returns the instance's version string, or null if unavailable.
function fetchVersion(inst) {
  const url = inst.proxied
    ? `/api/instances/${encodeURIComponent(inst.name)}/health`
    : '/api/health';
  return fetchWithTimeout(url, 3000)
    .then(r => r.ok ? r.json() : null)
    .then(j => (j && j.version) ? j.version : null)
    .catch(() => null);
}

async function refresh() {
  await loadInstances();
  allRecords = [];
  instanceStatuses = {};

  const results = await Promise.allSettled(
    instances.map(inst =>
      fetchRecords(inst)
        .then(records => {
          instanceStatuses[inst.name] = 'ok';
          return records.map(rec => ({ ...rec, _instance: inst.name }));
        })
        .catch(err => {
          instanceStatuses[inst.name] = 'err';
          console.warn(`Instance '${inst.name}' unreachable:`, err.message);
          return [];
        })
    )
  );

  results.forEach(r => { if (r.status === 'fulfilled') allRecords.push(...r.value); });

  instanceVersions = {};
  await Promise.all(instances.map(inst =>
    fetchVersion(inst).then(v => { if (v) instanceVersions[inst.name] = v; })));

  document.getElementById('lastRefresh').textContent =
    'Updated ' + new Date().toLocaleTimeString();

  renderTabs();
  applyFilters();
  updatePluginFilter();
}

function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  tabs.appendChild(makeTab('all', 'All', null, null));
  instances.forEach(inst => {
    tabs.appendChild(makeTab(
      inst.name, inst.name, instanceStatuses[inst.name], instanceVersions[inst.name]));
  });
}

function makeTab(id, label, status, version) {
  const el = document.createElement('div');
  el.className = 'tab' + (activeTab === id ? ' active' : '');
  el.onclick = () => { activeTab = id; renderTabs(); applyFilters(); };
  const led = document.createElement('span');
  // reachable + outdated → amber; reachable + current → green; unreachable → red.
  let ledState = '';
  if (status === 'ok') ledState = isOutdated(version) ? ' outdated' : ' ok';
  else if (status === 'err') ledState = ' err';
  led.className = 'led' + ledState;
  el.appendChild(led);
  el.append(label);
  if (version) {
    el.title = isOutdated(version)
      ? `v${version} — update available (latest v${latestVersion.join('.')})`
      : `v${version}`;
  }
  return el;
}

function applyFilters() {
  const pluginFilter = document.getElementById('filterPlugin').value;
  const statusFilter = document.getElementById('filterStatus').value;
  let records = allRecords;
  if (activeTab !== 'all') records = records.filter(r => r._instance === activeTab);
  if (pluginFilter)  records = records.filter(r => r.plugin === pluginFilter);
  if (statusFilter)  records = records.filter(r => r.dns_status === statusFilter);
  if (!grouped) records = sortRecords(records);
  renderTable(records);
  document.getElementById('recordCount').textContent =
    records.length + ' record' + (records.length !== 1 ? 's' : '');
}

function cmp(a, b, key) {
  if (key === 'last_updated') {
    return new Date(a[key] || 0) - new Date(b[key] || 0);
  }
  return String(a[key] ?? '').localeCompare(
    String(b[key] ?? ''), undefined, { numeric: true, sensitivity: 'base' });
}

// Flat sort (ungrouped view): one record per row, ordered by the active sort
// column, tie-broken by instance then container. A null sortKey keeps the
// default instance/container order.
function sortRecords(records) {
  const recs = records.slice();
  recs.sort((a, b) =>
    (sortKey ? sortDir * cmp(a, b, sortKey) : 0)
    || cmp(a, b, '_instance') || cmp(a, b, 'container_name'));
  return recs;
}

// Group records by hostname. Members within a group are kept in a fixed,
// sort-independent order (instance → container → type → value) so a hostname's
// collapsed values always render as "A - B", never "B - A", no matter which
// column the table is sorted by.
function intraGroupCmp(a, b) {
  return cmp(a, b, '_instance') || cmp(a, b, 'container_name')
    || cmp(a, b, 'record_type') || cmp(a, b, 'value');
}

function buildGroups(records) {
  const map = new Map();
  for (const r of records) {
    if (!map.has(r.hostname)) map.set(r.hostname, []);
    map.get(r.hostname).push(r);
  }
  return [...map.entries()].map(([host, recs]) => ({
    host, records: recs.slice().sort(intraGroupCmp),
  }));
}

// A group's representative value for the active sort column: the most recent
// timestamp for Last Updated, otherwise the group's distinct values joined so
// groups order sensibly by that column even when a cell holds several values.
function groupValue(group, key) {
  if (key === 'last_updated') {
    return group.records.reduce(
      (max, r) => Math.max(max, new Date(r.last_updated || 0).getTime()), 0);
  }
  return distinct(group.records, r => r[key]).join(' ');
}

function cmpGroups(a, b, key) {
  if (key === 'last_updated') return groupValue(a, key) - groupValue(b, key);
  return String(groupValue(a, key)).localeCompare(
    String(groupValue(b, key)), undefined, { numeric: true, sensitivity: 'base' });
}

// Grouped view: sort the hostname groups by the active column (default and
// tie-break by hostname), independent of grouping itself.
function sortGroups(groups) {
  const key = sortKey || 'hostname';
  const dir = sortKey ? sortDir : 1;
  return groups.slice().sort((a, b) =>
    dir * cmpGroups(a, b, key) || cmpGroups(a, b, 'hostname'));
}

// theme -------------------------------------------------------------------
// Dark is the brand mode and the default; the choice persists per browser.
const THEME_KEY = 'ext-dns-theme';

function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  const btn = document.getElementById('themeToggle');
  const goingLight = theme === 'dark';   // the mode the button switches *to*
  btn.textContent = goingLight ? '☀' : '☾';
  btn.title = goingLight ? 'Switch to light mode' : 'Switch to dark mode';
  btn.setAttribute('aria-label', btn.title);
}

function toggleTheme() {
  const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  try { localStorage.setItem(THEME_KEY, next); } catch {}
  applyTheme(next);
}

function toggleGroup() {
  grouped = !grouped;
  updateGroupToggle();
  applyFilters();
}

function updateGroupToggle() {
  document.getElementById('groupToggle').classList.toggle('active', grouped);
}

function setupSorting() {
  document.querySelectorAll('#headRow th').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.key;
      if (sortKey === key) {
        sortDir = -sortDir;
      } else {
        sortKey = key;
        sortDir = 1;
      }
      updateSortIndicators();
      applyFilters();
    });
  });
}

function updateSortIndicators() {
  document.querySelectorAll('#headRow th').forEach(th => {
    const arrow = th.querySelector('.arrow');
    if (th.dataset.key === sortKey) {
      th.classList.add('sorted');
      arrow.textContent = sortDir === 1 ? '▲' : '▼';
    } else {
      th.classList.remove('sorted');
      arrow.textContent = '';
    }
  });
}

function updatePluginFilter() {
  const plugins = [...new Set(allRecords.map(r => r.plugin))].sort();
  const sel = document.getElementById('filterPlugin');
  const cur = sel.value;
  sel.innerHTML = '<option value="">All plugins</option>' +
    plugins.map(p => `<option value="${p}"${p===cur?' selected':''}>${p}</option>`).join('');
}

function renderTable(records) {
  const tbody = document.getElementById('tbody');
  const empty = document.getElementById('emptyState');
  const emptyMsg = document.getElementById('emptyMsg');
  if (records.length === 0) {
    tbody.innerHTML = '';
    empty.classList.remove('hidden');
    emptyMsg.textContent = allRecords.length === 0
      ? 'No containers with ext-dns labels found.'
      : 'No records match the current filters.';
    return;
  }
  empty.classList.add('hidden');
  let html = '';
  if (grouped) {
    // Collapse each hostname's records into one row, deduping per column.
    for (const g of sortGroups(buildGroups(records))) {
      html += groupedRow(g.records, g.host);
    }
  } else {
    for (const r of records) html += flatRow(r);
  }
  tbody.innerHTML = html;
}

// Distinct values of `field` across the group, preserving first-seen order.
function distinct(group, field) {
  return [...new Set(group.map(field))];
}

// Join distinct rendered fragments with a muted separator.
const CELL_SEP = ' <span class="cell-sep">-</span> ';
function joinCells(parts) { return parts.join(CELL_SEP); }

// A single record rendered as its own row (ungrouped / flat sort).
function flatRow(r) {
  return `
    <tr>
      <td><span class="instance-label">${esc(r._instance)}</span></td>
      <td>${esc(r.container_name)}</td>
      <td>${esc(r.plugin)}</td>
      <td class="mono">${esc(r.hostname)}</td>
      <td><span class="type-badge ${esc(r.record_type)}">${esc(r.record_type)}</span></td>
      <td class="mono">${esc(r.value)}</td>
      <td><span class="source-badge ${esc(r.source)}">${esc(r.source)}</span></td>
      <td style="color:var(--text-muted)">${fmtDate(r.last_updated)}</td>
      <td>${statusBadge(r.dns_status)}</td>
    </tr>`;
}

// All records sharing `host` collapsed into one row; each cell shows the
// distinct values for that column (a single value when they all match).
function groupedRow(group, host) {
  const instances = joinCells(distinct(group, r => r._instance)
    .map(v => `<span class="instance-label">${esc(v)}</span>`));
  const containers = joinCells(distinct(group, r => r.container_name).map(esc));
  const plugins = joinCells(distinct(group, r => r.plugin).map(esc));
  const types = joinCells(distinct(group, r => r.record_type)
    .map(v => `<span class="type-badge ${esc(v)}">${esc(v)}</span>`));
  const values = joinCells(distinct(group, r => r.value).map(esc));
  const sources = joinCells(distinct(group, r => r.source)
    .map(v => `<span class="source-badge ${esc(v)}">${esc(v)}</span>`));
  const updated = joinCells(distinct(group, r => fmtDate(r.last_updated)));
  const statuses = joinCells(distinct(group, r => r.dns_status).map(statusBadge));
  return `
    <tr>
      <td>${instances}</td>
      <td>${containers}</td>
      <td>${plugins}</td>
      <td class="mono">${esc(host)}</td>
      <td>${types}</td>
      <td class="mono">${values}</td>
      <td>${sources}</td>
      <td style="color:var(--text-muted)">${updated}</td>
      <td>${statuses}</td>
    </tr>`;
}

function statusBadge(status) {
  const labels = {
    NOERROR: 'NOERROR', NXDOMAIN: 'NXDOMAIN',
    MISMATCH: 'MISMATCH', SERVFAIL: 'SERVFAIL',
    checking: 'Checking…', pending: 'Pending',
  };
  return `<span class="badge ${esc(status)}">${labels[status] || esc(status)}</span>`;
}

function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function esc(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

setupSorting();
applyTheme(document.documentElement.dataset.theme === 'light' ? 'light' : 'dark');
updateGroupToggle();
loadVersion();
refresh();
setInterval(refresh, 30000);
setInterval(checkLatestVersion, VERSION_CHECK_INTERVAL);
</script>
</body>
</html>
